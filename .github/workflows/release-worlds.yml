name: Versions publiques — Coup de Main

# This workflow runs from the standalone public export. Its package.json is
# scripts/public-package.json in the creation checkout.
on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/release-worlds.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coup-de-main-public-releases
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Valider la version et vérifier la release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync, readFileSync} from 'node:fs';
          const {version} = JSON.parse(readFileSync('package.json', 'utf8'));
          const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$/;
          const match = typeof version === 'string' && version.length <= 128 ? version.match(semver) : null;
          if (!match || match[0] !== version) throw new Error('package.json doit contenir une version SemVer valide.');
          const tag = `v${version}`;
          const response = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/releases/tags/${encodeURIComponent(tag)}`, {
            headers: {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'},
          });
          if (response.status !== 200 && response.status !== 404) {
            throw new Error(`Vérification de la release impossible : HTTP ${response.status}.`);
          }
          const exists = response.status === 200;
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ntag=${tag}\nprerelease=${Boolean(match[4])}\nexists=${exists}\n`);
          console.log(exists ? `${tag} existe déjà : aucun fichier ni tag ne sera remplacé.` : `Préparation de ${tag}.`);
          NODE

      - name: Installer les dépendances
        if: steps.version.outputs.exists == 'false'
        run: npm ci

      - name: Vérifier et compiler le jeu
        if: steps.version.outputs.exists == 'false'
        run: npm run check

      - name: Préparer le HTML, le ZIP et les empreintes
        if: steps.version.outputs.exists == 'false'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/offline-play.html
          node --input-type=module <<'NODE'
          import {copyFileSync, mkdirSync, readFileSync, writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          const version = process.env.RELEASE_VERSION;
          const folder = join(process.env.RUNNER_TEMP, 'coup-de-main-release');
          mkdirSync(folder, {recursive: true});
          copyFileSync('dist/offline-play.html', join(folder, `Coup-de-Main-${version}.html`));
          const releaseEntry = readFileSync('CHANGELOG.md', 'utf8').split(/^## /m)
            .find(section => section.split('\n', 1)[0].startsWith(`[${version}]`));
          const changes = releaseEntry?.split('\n').slice(1).join('\n').trim();
          if (!changes) throw new Error(`CHANGELOG.md doit décrire la version ${version}.`);
          const notes = [
            `# Coup de Main ${version}`,
            '',
            changes,
            '',
            '## Fichiers prêts à lancer',
            '',
            `- **Coup-de-Main-${version}.html** : télécharge puis ouvre le fichier dans un navigateur moderne.`,
            `- **Coup-de-Main-${version}-web.zip** : décompresse puis héberge le dossier contenant index.html et ses ressources séparées. Le HTML autonome est proposé à part.`,
            `- **SHA256SUMS-${version}.txt** : empreintes des deux fichiers pour vérifier leur intégrité.`,
            '',
            'Le HTML autonome embarque ses illustrations et son code. Le ZIP web garde les ressources séparées pour leur chargement dans le navigateur. Le son commence après une interaction du joueur. La sauvegarde dépend du navigateur et de l’adresse utilisée.',
            '',
            `Sources compilées : ${process.env.GITHUB_SHA}.`,
            'Les contrôles de types, les tests et le build ont réussi dans ce workflow.',
            '',
          ].join('\n');
          writeFileSync(join(folder, 'release-notes.md'), notes, 'utf8');
          NODE
          release_directory="${RUNNER_TEMP}/coup-de-main-release"
          (
            cd dist
            zip -qr "${release_directory}/Coup-de-Main-${RELEASE_VERSION}-web.zip" . -x 'offline-play.html' './offline-play.html'
          )
          (
            cd "$release_directory"
            sha256sum "Coup-de-Main-${RELEASE_VERSION}.html" "Coup-de-Main-${RELEASE_VERSION}-web.zip" > "SHA256SUMS-${RELEASE_VERSION}.txt"
          )

      - name: Publier une nouvelle release sans écraser l’existante
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          node --input-type=module <<'NODE'
          import {spawnSync} from 'node:child_process';
          import {join} from 'node:path';
          const {GITHUB_API_URL, GITHUB_REPOSITORY, GITHUB_SHA, GH_TOKEN, RELEASE_VERSION, RELEASE_TAG, RELEASE_PRERELEASE, RUNNER_TEMP} = process.env;
          const base = `${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}`;
          const headers = {Authorization: `Bearer ${GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'};
          const existing = await fetch(`${base}/releases/tags/${encodeURIComponent(RELEASE_TAG)}`, {headers});
          if (existing.status === 200) {
            console.log(`${RELEASE_TAG} a déjà été créée : publication ignorée, aucun écrasement.`);
            process.exit(0);
          }
          if (existing.status !== 404) throw new Error(`Vérification finale de la release impossible : HTTP ${existing.status}.`);

          // An existing tag must refer to the sources that were actually built.
          const tag = await fetch(`${base}/git/ref/tags/${encodeURIComponent(RELEASE_TAG)}`, {headers});
          if (tag.status === 200) {
            const commit = await fetch(`${base}/commits/${encodeURIComponent(RELEASE_TAG)}`, {headers});
            if (commit.status !== 200) throw new Error(`Résolution du tag impossible : HTTP ${commit.status}.`);
            if ((await commit.json()).sha !== GITHUB_SHA) throw new Error('Le tag existant pointe vers un autre commit ; aucune modification du tag ni publication.');
          } else if (tag.status !== 404) {
            throw new Error(`Vérification du tag impossible : HTTP ${tag.status}.`);
          }

          const folder = join(RUNNER_TEMP, 'coup-de-main-release');
          const args = [
            'release', 'create', RELEASE_TAG,
            join(folder, `Coup-de-Main-${RELEASE_VERSION}.html`),
            join(folder, `Coup-de-Main-${RELEASE_VERSION}-web.zip`),
            join(folder, `SHA256SUMS-${RELEASE_VERSION}.txt`),
            '--repo', GITHUB_REPOSITORY,
            '--target', GITHUB_SHA,
            '--title', `Coup de Main ${RELEASE_VERSION}`,
            '--notes-file', join(folder, 'release-notes.md'),
          ];
          if (RELEASE_PRERELEASE === 'true') args.push('--prerelease');
          const result = spawnSync('gh', args, {stdio: 'inherit'});
          if (result.error) throw result.error;
          process.exit(result.status ?? 1);
          NODE
